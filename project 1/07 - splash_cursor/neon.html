<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cursor - MageUI</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0e27;
      cursor: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .info-text {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 100;
      color: #e0e7ff;
      font-weight: 500;
    }

    .info-text h2 {
      margin: 0 0 5px 0;
      font-size: 1.3em;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    .info-text p {
      margin: 0;
      opacity: 0.6;
      font-size: 0.9em;
    }

    .back-btn {
      position: fixed;
      bottom: 40px;
      left: 40px;
      z-index: 100;
      padding: 10px 20px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: #00ff88;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
    }

    .back-btn:hover {
      background: rgba(0, 255, 136, 0.2);
      border-color: rgba(0, 255, 136, 0.6);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="info-text">
  <h2>Neon Cursor</h2>
  <p>Neon glow effect with trailing lines</p>
</div>

<a href="./index.html" class="back-btn">← Back</a>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  const cursor = { x: canvas.width / 2, y: canvas.height / 2 };
  const trails = [];

  class NeonTrail {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 4;
      this.vy = (Math.random() - 0.5) * 4;
      this.life = 1;
      this.hue = Math.random() * 60; // Green to cyan
    }

    update() {
      const dx = cursor.x - this.x;
      const dy = cursor.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const pull = Math.max(0.003, 0.2 / (dist + 50));
      this.vx += dx * pull;
      this.vy += dy * pull;

      this.vx *= 0.92;
      this.vy *= 0.92;

      this.x += this.vx;
      this.y += this.vy;

      this.life -= 0.008;
    }

    draw() {
      if (this.life <= 0) return;

      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 50%, ${this.life * 0.8})`;
      ctx.lineCap = "round";
      ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, ${this.life * 0.6})`;
      ctx.shadowBlur = 10;
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
      ctx.stroke();
      ctx.shadowColor = "transparent";
    }
  }

  document.addEventListener("mousemove", (e) => {
    cursor.x = e.clientX;
    cursor.y = e.clientY;

    if (Math.random() > 0.4) {
      trails.push(new NeonTrail(cursor.x, cursor.y));
    }
  });

  function animate() {
    requestAnimationFrame(animate);

    ctx.fillStyle = "rgba(10, 14, 39, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    while (trails.length > 300) trails.shift();

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].update();
      trails[i].draw();
      if (trails[i].life <= 0) {
        trails.splice(i, 1);
      }
    }

    // Cursor center
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#00ff88";
    ctx.fill();
    ctx.shadowColor = "#00ff88";
    ctx.shadowBlur = 15;
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowColor = "transparent";
  }

  animate();
</script>

</body>
</html>
