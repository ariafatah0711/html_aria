<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Cursor - MageUI</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .info-text {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 100;
      color: #0ff;
      font-weight: 500;
      text-shadow: 0 0 10px #0ff;
    }

    .info-text h2 {
      margin: 0 0 5px 0;
      font-size: 1.3em;
      color: #0ff;
      text-shadow: 0 0 15px #0ff, 2px 2px 0 #f0f, -2px -2px 0 #ff0;
      font-family: 'Courier New', monospace;
    }

    .info-text p {
      margin: 0;
      opacity: 0.7;
      font-size: 0.9em;
      font-family: 'Courier New', monospace;
    }

    .back-btn {
      position: fixed;
      bottom: 40px;
      left: 40px;
      z-index: 100;
      padding: 10px 20px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.6);
      color: #0ff;
      text-decoration: none;
      border-radius: 0;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      text-shadow: 0 0 5px #0ff;
    }

    .back-btn:hover {
      background: rgba(0, 255, 255, 0.2);
      border-color: rgba(0, 255, 255, 1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 2px 2px 0 #f0f, -2px -2px 0 #ff0;
      transform: translate(-2px, -2px);
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="info-text">
  <h2>GLITCH</h2>
  <p>RGB displacement glitch effect</p>
</div>

<a href="./index.html" class="back-btn">← Back</a>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  const cursor = { x: canvas.width / 2, y: canvas.height / 2 };
  const trails = [];
  let glitchIntensity = 0;

  class GlitchTrail {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 6;
      this.vy = (Math.random() - 0.5) * 6;
      this.life = 1;
      this.size = Math.random() * 5 + 2;
      this.color = ["#0ff", "#f0f", "#ff0"][Math.floor(Math.random() * 3)];
    }

    update() {
      this.vx *= 0.93;
      this.vy *= 0.93;

      this.x += this.vx;
      this.y += this.vy;

      this.life -= 0.012;
      this.size *= 0.95;
    }

    draw() {
      if (this.life <= 0) return;

      // RGB offset glitch
      const offset = Math.sin(Date.now() * 0.01) * 3;

      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.life * 0.7;

      // Draw with offset for glitch effect
      ctx.beginPath();
      ctx.arc(this.x + offset, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
    }
  }

  document.addEventListener("mousemove", (e) => {
    cursor.x = e.clientX;
    cursor.y = e.clientY;
    glitchIntensity = Math.min(1, glitchIntensity + 0.1);

    if (Math.random() > 0.3) {
      trails.push(new GlitchTrail(cursor.x, cursor.y));
    }
  });

  document.addEventListener("mouseleave", () => {
    glitchIntensity = Math.max(0, glitchIntensity - 0.05);
  });

  function animate() {
    requestAnimationFrame(animate);

    // Dark background with scan lines
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Scan lines
    ctx.strokeStyle = "rgba(0, 255, 255, 0.02)";
    ctx.lineWidth = 1;
    for (let y = 0; y < canvas.height; y += 2) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

    while (trails.length > 200) trails.shift();

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].update();
      trails[i].draw();
      if (trails[i].life <= 0) {
        trails.splice(i, 1);
      }
    }

    // Cursor with glitch
    const glitchOffset = glitchIntensity * 5;

    // Cyan channel
    ctx.fillStyle = "#0ff";
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(cursor.x + glitchOffset * Math.sin(Date.now() * 0.01), cursor.y, 6, 0, Math.PI * 2);
    ctx.fill();

    // Magenta channel
    ctx.fillStyle = "#f0f";
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(cursor.x - glitchOffset * Math.sin(Date.now() * 0.01), cursor.y + glitchOffset, 6, 0, Math.PI * 2);
    ctx.fill();

    // Yellow channel
    ctx.fillStyle = "#ff0";
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y - glitchOffset, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;

    // Ring
    ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + glitchIntensity * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y, 15, 0, Math.PI * 2);
    ctx.stroke();
  }

  animate();
</script>

</body>
</html>
